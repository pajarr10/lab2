name = "pajar-traffic-lab"
main = "src/index.js"
compatibility_date = "2026-11-05"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
# Route all asset paths through the Worker so requests can be counted.
run_worker_first = true

[[durable_objects.bindings]]
name = "TRAFFIC_COUNTER"
class_name = "TrafficCounter"

[exports.TrafficCounter]
type = "durable-object"
storage = "sqlite"
